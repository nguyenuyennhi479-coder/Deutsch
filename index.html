<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deutsch Lernen – Học tiếng Đức từ A1 đến B1</title>
  <meta name="description" content="Công cụ học tiếng Đức từ cơ bản đến nâng cao: flashcard, trắc nghiệm, nghe, gõ chính tả, der/die/das, ngữ pháp A1–B1 và lặp lại ngắt quãng. Chạy offline trong trình duyệt.">
  <meta name="theme-color" content="#fdf8f3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Deutsch">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇩🇪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
/* =================== Design tokens =================== */
:root {
  --bg: #fdf8f3;
  --bg-2: #ffffff;
  --surface: #ffffff;
  --surface-2: #fff1ee;
  --border: rgba(232, 69, 79, 0.22);
  --border-strong: rgba(232, 69, 79, 0.45);
  --text: #1f2a5a;
  --muted: #66709a;
  --dim: #9aa1c0;
  --gold: #e8454f;
  --red: #e8454f;
  --accent: linear-gradient(135deg, #ff6b7a 0%, #e8454f 100%);
  --accent-soft: linear-gradient(135deg, #ffe3e8, #fff0d6);
  --ok: #2fae6f;
  --ko: #e8454f;
  --der: #2f6fe0;
  --die: #e0457f;
  --das: #2fae6f;
  --a1: #2fae6f;
  --a2: #2f6fe0;
  --b1: #f08a24;
  /* pastel panels */
  --pink: #ffe3e8;
  --pink-d: #e8454f;
  --blue: #e1efff;
  --blue-d: #2f6fe0;
  --green: #e2f5df;
  --green-d: #2f9b55;
  --yellow: #fff3c9;
  --yellow-d: #d99a00;
  --purple: #eee6fb;
  --purple-d: #7a4fd0;
  --navy: #1f2a5a;
  --radius: 20px;
  --radius-sm: 14px;
  --shadow: 0 14px 34px -14px rgba(31, 42, 90, .28);
  --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  --sidebar: 248px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
input, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; letter-spacing: -0.01em; }
::selection { background: rgba(255, 159, 67, .35); }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .08); border-radius: 10px; }

/* =================== Background =================== */
.bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg-orbs span { position: absolute; border-radius: 50%; filter: blur(110px); opacity: .32; animation: float 22s ease-in-out infinite; }
.bg-orbs span:nth-child(1) { width: 520px; height: 520px; background: #ff4f5e; top: -180px; right: -120px; }
.bg-orbs span:nth-child(2) { width: 460px; height: 460px; background: #4d5cff; bottom: -200px; left: 10%; animation-delay: -7s; opacity: .22; }
.bg-orbs span:nth-child(3) { width: 360px; height: 360px; background: #ffcc3d; top: 40%; right: 25%; animation-delay: -14s; opacity: .12; }
@keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(40px, -30px) scale(1.08); } }

/* =================== Layout =================== */
.app { display: flex; min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar);
  padding: 26px 16px; display: flex; flex-direction: column; gap: 6px;
  background: rgba(10, 12, 22, .7); backdrop-filter: blur(18px);
  border-right: 1px solid var(--border); z-index: 20;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 22px; }
.brand-flag { width: 40px; height: 40px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 24px -8px rgba(255, 79, 94, .6); transform: rotate(-6deg); }
.brand-flag i { flex: 1; }
.brand-flag i:nth-child(1) { background: #1b1b1f; }
.brand-flag i:nth-child(2) { background: #e0262f; }
.brand-flag i:nth-child(3) { background: #ffcc00; }
.brand b { font-family: var(--font-display); font-size: 1.2rem; display: block; }
.brand small { color: var(--muted); font-size: .75rem; }
.nav-link {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px;
  color: var(--muted); font-weight: 500; transition: .2s;
}
.nav-link .ico { font-size: 1.15rem; width: 24px; text-align: center; }
.nav-link:hover { background: var(--surface); color: var(--text); }
.nav-link.active { background: var(--accent-soft); color: var(--text); box-shadow: inset 0 0 0 1px rgba(255, 159, 67, .25); }
.nav-link .badge { margin-left: auto; background: var(--red); color: #fff; font-size: .7rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; }
.sidebar-foot { margin-top: auto; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); font-size: .8rem; color: var(--muted); }
.sidebar-foot b { color: var(--text); }

.view { flex: 1; margin-left: var(--sidebar); padding: 36px clamp(18px, 4vw, 56px) 110px; max-width: 1280px; width: 100%; animation: fadeUp .35s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.bottom-nav { display: none; }

/* =================== Common =================== */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.page-head h1 { font-size: clamp(1.7rem, 3vw, 2.3rem); }
.page-head p { color: var(--muted); margin-top: 6px; }
.eyebrow { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.grad-text { background: var(--accent); -webkit-background-clip: text; background-clip: text; color: transparent; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px; backdrop-filter: blur(12px); position: relative;
}
.card.hover { transition: transform .25s, border-color .25s, background .25s; cursor: pointer; }
.card.hover:hover { transform: translateY(-4px); border-color: var(--border-strong); background: var(--surface-2); }
.grid { display: grid; gap: 18px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.section { margin-top: 38px; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.section-title h2 { font-size: 1.3rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px; border-radius: 12px; font-weight: 600; transition: .2s;
  background: var(--surface-2); border: 1px solid var(--border);
}
.btn:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.btn:active { transform: translateY(1px) scale(.98); }
.btn-primary { background: var(--accent); border: none; color: #1a0f05; box-shadow: 0 10px 30px -10px rgba(255, 110, 70, .7); }
.btn-primary:hover { box-shadow: 0 14px 34px -10px rgba(255, 110, 70, .9); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 7px 13px; font-size: .85rem; border-radius: 10px; }
.btn-lg { padding: 15px 28px; font-size: 1.05rem; border-radius: 14px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.icon-btn { width: 38px; height: 38px; border-radius: 11px; display: inline-grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); transition: .2s; font-size: 1rem; flex-shrink: 0; }
.icon-btn:hover { background: rgba(255, 159, 67, .18); border-color: rgba(255, 159, 67, .4); transform: scale(1.06); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn.playing { background: rgba(255, 204, 61, .25); border-color: var(--gold); transform: scale(1.12); box-shadow: 0 0 16px rgba(255, 204, 61, .5); }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: .74rem; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.chip.lv-A1 { color: var(--a1); border-color: rgba(61, 220, 151, .35); background: rgba(61, 220, 151, .1); }
.chip.lv-A2 { color: var(--a2); border-color: rgba(90, 169, 255, .35); background: rgba(90, 169, 255, .1); }
.chip.lv-B1 { color: var(--b1); border-color: rgba(255, 159, 67, .35); background: rgba(255, 159, 67, .1); }
.chip.zfa { color: #c9a7ff; border-color: rgba(201, 167, 255, .35); background: rgba(201, 167, 255, .1); }

.g-der { color: var(--der); }
.g-die { color: var(--die); }
.g-das { color: var(--das); }

.bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .07); overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.bar .m { background: var(--ok); }
.bar .l { background: var(--gold); }
.bar .fill { background: var(--accent); }

.tabs { display: inline-flex; padding: 5px; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
.tab { padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: .9rem; color: var(--muted); transition: .2s; }
.tab:hover { color: var(--text); }
.tab.active { background: var(--surface-2); color: var(--text); box-shadow: 0 2px 12px rgba(0, 0, 0, .3); }

/* =================== Home =================== */
.hero {
  display: grid; grid-template-columns: 1fr auto; gap: 26px; align-items: center;
  padding: 32px; border-radius: 26px; overflow: hidden;
  background: linear-gradient(135deg, rgba(255, 79, 94, .16), rgba(77, 92, 255, .1) 60%, rgba(255, 204, 61, .08));
  border: 1px solid var(--border);
}
.hero h1 { font-size: clamp(1.8rem, 3.6vw, 2.7rem); margin: 8px 0 10px; }
.hero p { color: var(--muted); max-width: 560px; }
.hero .row { margin-top: 22px; }
.ring { position: relative; width: 150px; height: 150px; }
.ring svg { transform: rotate(-90deg); }
.ring .ring-bg { stroke: rgba(255, 255, 255, .08); }
.ring .ring-fg { stroke: url(#ringGrad); stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.2, .8, .2, 1); }
.ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-label b { font-family: var(--font-display); font-size: 2rem; }
.ring-label small { color: var(--muted); font-size: .75rem; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 22px; }
.stat { padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
.stat .v { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; }
.stat .k { color: var(--muted); font-size: .82rem; }
.stat .e { font-size: 1.3rem; float: right; }

.level-card { overflow: hidden; }
.level-card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--lv); }
.level-card .lv-badge { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; color: var(--lv); background: color-mix(in srgb, var(--lv) 14%, transparent); border: 1px solid color-mix(in srgb, var(--lv) 35%, transparent); }
.level-card h3 { font-size: 1.15rem; }
.level-card .meta { display: grid; gap: 10px; margin-top: 16px; font-size: .82rem; color: var(--muted); }
.level-card .meta div { display: grid; gap: 5px; }
.path { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; position: relative; }

.cta-card { display: flex; align-items: center; gap: 18px; }
.cta-card .big-ico { font-size: 2.2rem; width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--surface-2); flex-shrink: 0; }
.cta-card h3 { font-size: 1.05rem; }

/* =================== Topics =================== */
.topic-card { display: flex; flex-direction: column; gap: 12px; }
.topic-card .top { display: flex; align-items: center; gap: 12px; }
.topic-card .t-ico { font-size: 1.7rem; width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; background: var(--surface-2); flex-shrink: 0; transition: transform .3s; }
.topic-card:hover .t-ico { transform: rotate(-8deg) scale(1.08); }
.topic-card h3 { font-size: 1rem; font-weight: 600; }
.topic-card .foot { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); }

.mode-ladder { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.mode-btn { text-align: left; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); transition: .2s; display: flex; flex-direction: column; gap: 4px; }
.mode-btn:hover { border-color: rgba(255, 159, 67, .5); background: var(--accent-soft); transform: translateY(-3px); }
.mode-btn .m-top { display: flex; align-items: center; justify-content: space-between; }
.mode-btn .m-ico { font-size: 1.5rem; }
.mode-btn .step { font-size: .7rem; color: var(--gold); font-weight: 700; letter-spacing: .08em; }
.mode-btn b { font-size: .98rem; }
.mode-btn span { font-size: .78rem; color: var(--muted); }
.dots { display: flex; gap: 3px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, .15); }
.dots i.on { background: var(--gold); }

.word-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
.word-row { background: var(--surface); transition: .2s; }
.word-row:hover { background: var(--surface-2); }
.word-row td { padding: 13px 14px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); vertical-align: middle; }
.word-row td:first-child { border-left: 1px solid var(--border); border-radius: 14px 0 0 14px; }
.word-row td:last-child { border-right: 1px solid var(--border); border-radius: 0 14px 14px 0; white-space: nowrap; text-align: right; }
.word-de { font-weight: 700; font-size: 1.05rem; }
.word-extra { color: var(--muted); font-size: .83rem; }
.st-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: rgba(255, 255, 255, .15); margin-right: 8px; vertical-align: middle; }
.st-dot.learning { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.st-dot.mastered { background: var(--ok); box-shadow: 0 0 10px var(--ok); }

/* =================== Practice =================== */
.practice { max-width: 720px; margin: 0 auto; }
.p-head { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
.p-head .bar { flex: 1; height: 10px; }
.p-count { font-weight: 600; color: var(--muted); font-size: .9rem; min-width: 52px; text-align: right; }
.q-card { padding: 34px; text-align: center; border-radius: 26px; animation: pop .35s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes pop { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: none; } }
.q-label { color: var(--muted); font-size: .85rem; margin-bottom: 14px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
.q-word { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 3.1rem); font-weight: 700; line-height: 1.15; word-break: break-word; }
.q-sub { color: var(--muted); margin-top: 10px; }
.q-actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
.opt {
  padding: 16px 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border);
  font-weight: 600; font-size: 1.02rem; transition: .18s; text-align: left; display: flex; gap: 12px; align-items: center;
}
.opt kbd { font-family: var(--font); font-size: .72rem; color: var(--dim); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; }
.opt:hover:not([disabled]) { border-color: var(--border-strong); background: var(--surface-2); transform: translateY(-2px); }
.opt.correct { background: rgba(61, 220, 151, .16); border-color: var(--ok); color: #b9ffe0; animation: bounce .4s; }
.opt.wrong { background: rgba(255, 92, 122, .14); border-color: var(--ko); color: #ffc2cf; animation: shake .4s; }
.opt[disabled] { cursor: default; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes bounce { 50% { transform: scale(1.04); } }

.gender-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 26px; }
.gender-btns .opt { justify-content: center; font-size: 1.4rem; font-family: var(--font-display); padding: 22px; }
.gender-btns .opt[data-g="der"] { color: var(--der); }
.gender-btns .opt[data-g="die"] { color: var(--die); }
.gender-btns .opt[data-g="das"] { color: var(--das); }

.flip { perspective: 1400px; cursor: pointer; min-height: 300px; }
.flip-inner { position: relative; min-height: 300px; transition: transform .6s cubic-bezier(.3, .8, .3, 1); transform-style: preserve-3d; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; border-radius: 26px; background: var(--surface); border: 1px solid var(--border); }
.flip-back { transform: rotateY(180deg); background: linear-gradient(135deg, rgba(255, 79, 94, .12), rgba(255, 204, 61, .08)); }
.flip-hint { position: absolute; bottom: 16px; font-size: .78rem; color: var(--dim); }
.grade-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
.grade-btns .btn { flex-direction: column; gap: 2px; padding: 14px; }
.grade-btns small { font-weight: 400; color: var(--muted); font-size: .72rem; }
.g-again { border-color: rgba(255, 92, 122, .4) !important; }
.g-hard { border-color: rgba(255, 204, 61, .4) !important; }
.g-good { border-color: rgba(61, 220, 151, .45) !important; }

.type-box { display: flex; gap: 10px; margin-top: 24px; }
.type-input {
  flex: 1; padding: 16px 18px; border-radius: 14px; background: rgba(0, 0, 0, .25);
  border: 1px solid var(--border-strong); font-size: 1.2rem; outline: none; transition: .2s;
}
.type-input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255, 204, 61, .12); }
.type-input.ok { border-color: var(--ok); }
.type-input.bad { border-color: var(--ko); animation: shake .4s; }
.umlauts { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
.umlauts button { width: 44px; height: 40px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 600; font-size: 1.05rem; transition: .15s; }
.umlauts button:hover { border-color: var(--gold); }

.feedback { margin-top: 18px; padding: 18px 20px; border-radius: 18px; text-align: left; display: flex; gap: 14px; align-items: center; animation: fadeUp .25s; }
.feedback.ok { background: rgba(61, 220, 151, .1); border: 1px solid rgba(61, 220, 151, .35); }
.feedback.ko { background: rgba(255, 92, 122, .1); border: 1px solid rgba(255, 92, 122, .35); }
.feedback .f-ico { font-size: 1.8rem; }
.feedback .f-body { flex: 1; }
.feedback .f-title { font-weight: 700; }
.next-row { display: flex; justify-content: flex-end; margin-top: 16px; }
.kbd-hint { text-align: center; color: var(--dim); font-size: .78rem; margin-top: 18px; }

.result { text-align: center; padding: 40px 30px; }
.result .big { font-size: 4rem; animation: pop .5s; }
.result h2 { font-size: 2rem; margin: 10px 0; }
.result-stats { display: flex; justify-content: center; gap: 30px; margin: 22px 0; }
.result-stats div b { display: block; font-family: var(--font-display); font-size: 1.8rem; }
.result-stats div span { color: var(--muted); font-size: .82rem; }
.wrong-list { text-align: left; margin-top: 20px; display: grid; gap: 8px; }
.wrong-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }

/* =================== Grammar =================== */
.lesson { max-width: 860px; }
.lesson-body { font-size: 1rem; }
.lesson-body p, .lesson-body ul { margin: 12px 0; }
.lesson-body ul { padding-left: 22px; }

/* =========================================================
   Deutsch Lernen – ứng dụng học tiếng Đức (single-file, offline)
   ========================================================= */
(() => {
  'use strict';

  /* ---------------- Utils ---------------- */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const DAY = 86400000;
  const dayStr = (t = Date.now()) => new Date(t).toLocaleDateString('en-CA');
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

  /* ---------------- Data ---------------- */
  const LEVELS = {
    A1: { name: 'Cơ bản', color: 'var(--a1)', desc: 'Giao tiếp hằng ngày: chào hỏi, số đếm, gia đình, mua sắm, nha khoa cơ bản.' },
    A2: { name: 'Sơ trung cấp', color: 'var(--a2)', desc: 'Công việc, du lịch, thuê nhà, cảm xúc; Dativ, Perfekt, động từ khuyết thiếu.' },
    B1: { name: 'Trung cấp', color: 'var(--b1)', desc: 'Xã hội, môi trường, học tập; mệnh đề phụ, bị động, Konjunktiv II.' },
  };
  const genderOf = (w) => { const m = /^(der|die|das)\s*\((m|f|n)\)/i.exec(w.type || ''); return m ? m[1].toLowerCase() : null; };
  const nounBase = (w) => w.de.replace(/^(der|die|das)\s+/i, '');

  const TOPICS = [...(window.A1_DATA || []), ...(window.EXTRA_VOCAB || [])];
  const GRAMMAR = window.GRAMMAR || [];
  const WORDS = [];
  const WORD_BY_ID = {};
  TOPICS.forEach((t) => t.words.forEach((w, i) => {
    w.id = `${t.id}:${i}`; w.topic = t; w.level = t.level; w.gender = genderOf(w);
    WORDS.push(w); WORD_BY_ID[w.id] = w;
  }));

  /* ---------------- Progress (localStorage) ---------------- */
  const KEY = 'deutsch_lernen_v1';
  const defaults = () => ({
    cards: {}, xp: 0, streak: 0, lastDay: null, day: { date: dayStr(), count: 0 }, goal: 20, grammar: {},
    settings: { rate: 0.9, voice: '', engine: 'auto', autoplay: true },
  });
  let P = load();
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY)) || {};
      const d = defaults();
      return { ...d, ...raw, settings: { ...d.settings, ...(raw.settings || {}) }, day: raw.day || d.day };
    } catch { return defaults(); }
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch {} };

  /* ---------------- Spaced repetition (Leitner) ---------------- */
  const INTERVALS = [0, 1, 2, 4, 7, 15, 30]; // ngày theo hộp 0–6
  const status = (id) => { const c = P.cards[id]; if (!c) return 'new'; return c.box >= 4 ? 'mastered' : 'learning'; };
  const isDue = (id) => { const c = P.cards[id]; return !!c && c.due <= Date.now(); };
  const dueWords = () => WORDS.filter((w) => isDue(w.id));
  const weakWords = () => WORDS.filter((w) => { const c = P.cards[w.id]; return c && c.ko > 0 && c.box < 4; });

  function grade(id, result) {
    const c = P.cards[id] || { box: 0, due: 0, ok: 0, ko: 0 };
    if (result === 'good') { c.box = Math.min(c.box + 1, 6); c.ok++; c.due = Date.now() + INTERVALS[c.box] * DAY; }
    else if (result === 'hard') { c.box = Math.max(c.box, 1); c.ok++; c.due = Date.now() + DAY; }
    else { c.box = 1; c.ko++; c.due = Date.now() + 5 * 60000; }
    c.last = Date.now();
    P.cards[id] = c;
    activity(result === 'again' ? 2 : result === 'hard' ? 5 : 10);
  }

  function activity(xp) {
    const t = dayStr();
    if (P.day.date !== t) P.day = { date: t, count: 0 };
    if (P.lastDay !== t) {
      P.streak = P.lastDay === dayStr(Date.now() - DAY) ? P.streak + 1 : 1;
      P.lastDay = t;
    }
    const before = P.day.count;
    P.day.count++;
    P.xp += xp;
    if (before < P.goal && P.day.count >= P.goal) toast('🎉 Bạn đã hoàn thành mục tiêu hôm nay!');
    save();
    renderNav();
  }
  const streakNow = () => (P.lastDay === dayStr() || P.lastDay === dayStr(Date.now() - DAY) ? P.streak : 0);
  const todayCount = () => (P.day.date === dayStr() ? P.day.count : 0);

  function topicStats(words) {
    let m = 0, l = 0;
    words.forEach((w) => { const s = status(w.id); if (s === 'mastered') m++; else if (s === 'learning') l++; });
    return { m, l, n: words.length };
  }

  /* ---------------- Speech ---------------- */
  let voices = [];
  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    const all = speechSynthesis.getVoices();
    voices = all.filter((v) => /^de(-|_|$)/i.test(v.lang));
  }
  if ('speechSynthesis' in window) {
    loadVoices();
    speechSynthesis.onvoiceschanged = () => {
      loadVoices();
      if (currentRoute === 'settings') render();
    };
  }

  function pickVoice() {
    if (!voices.length) loadVoices();
    if (P.settings.voice) {
      const match = voices.find((v) => v.voiceURI === P.settings.voice);
      if (match) return match;
    }
    return (
      voices.find((v) => /anna|helena|katja|marlene|viktor|eddy|flo/i.test(v.name)) ||
      voices.find((v) => /google/i.test(v.name) && /^de/i.test(v.lang)) ||
      voices.find((v) => /^de-DE/i.test(v.lang)) ||
      voices.find((v) => /^de/i.test(v.lang)) ||
      null
    );
  }

  const cleanSpeech = (t) => String(t).replace(/\(.*?\)/g, ' ').replace(/\//g, ' ').replace(/\.\.\.|…/g, ', ').replace(/\s+/g, ' ').trim();

  function speak(text, slow = false, btn = null) {
    const t = cleanSpeech(text);
    if (!t) return;

    if (btn) {
      btn.classList.add('playing');
      setTimeout(() => btn.classList.remove('playing'), slow ? 1600 : 900);
    }

    if (!('speechSynthesis' in window)) {
      toast('Trình duyệt không hỗ trợ Web Speech API.');
      return;
    }

    try {
      if (speechSynthesis.paused) {
        speechSynthesis.resume();
      }
      speechSynthesis.cancel();

      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'de-DE';
      const v = pickVoice();
      if (v) u.voice = v;
      u.rate = slow ? 0.55 : (P.settings.rate || 0.95);
      u.pitch = 1.0;
      u.volume = 1.0;

      u.onend = () => { if (btn) btn.classList.remove('playing'); };
      u.onerror = (e) => {
        if (btn) btn.classList.remove('playing');
        console.warn('SpeechSynthesis error:', e);
      };

      speechSynthesis.speak(u);
    } catch (err) {
      console.error('speak error:', err);
    }
  }

  window.speak = speak;

  const sayBtns = (text) => {

  /* ---------------- UI helpers ---------------- */
  function toast(msg, ms = 2600) {

    setTimeout(() => el.remove(), ms);
  }
  function xpPop(x, target) {
    const r = target?.getBoundingClientRect?.() || { left: innerWidth / 2, top: innerHeight / 2, width: 0 };
    const el = document.createElement('div');
    el.className = 'xp-pop'; el.textContent = `+${x} XP`;
    el.style.left = r.left + r.width / 2 - 30 + 'px'; el.style.top = r.top - 10 + 'px';
    document.body.appendChild(el); setTimeout(() => el.remove(), 1000);
  }
  const deHTML = (w) => {
    const g = w.gender;
    if (!g) return esc(w.de);
    return `<span class="g-${g}">${esc(w.de.split(' ')[0])}</span> ${esc(nounBase(w))}`;
  };

  /* ---------------- Extra / Example parsing ---------------- */
  function parseExtra(extra) {
    if (!extra) return null;
    const str = extra.trim();
    if (str === '(chỉ số ít)' || str === '(chỉ dùng số ít)') {
      return { de: '', vi: 'Chỉ dùng số ít', isPlural: true, full: str };
    }
    const m = /^(.*?)\s*\(([^()]+)\)\s*$/.exec(str);
    if (m) {
      const dePart = m[1].trim();
      const viPart = m[2].trim();
      const isPlural = /^die\s+/i.test(dePart) || /số nhiều|plural|các\s+|những\s+/i.test(viPart);
      return { de: dePart, vi: viPart, isPlural, full: str };
    }
    const isPlural = /^die\s+/i.test(str);
    return { de: str, vi: '', isPlural, full: str };
  }

  function flashExtraHTML(w) {
    if (!w.extra) return '';
    const info = parseExtra(w.extra);

        </div>

    return `
      <div class="flash-extra-card">

        </div>

  }

  const levelChip = (lv) => `<span class="chip lv-${lv}">${lv}</span>`;

  /* ---------- Grammar ---------- */
  VIEWS.grammar = () => `
    <div class="page-head"><div><span class="eyebrow">Ngữ pháp</span><h1>Ngữ pháp A1 → B1</h1><p>Mỗi bài gồm giải thích tiếng Việt, bảng tóm tắt, ví dụ có phát âm và bài kiểm tra nhỏ. Đạt ≥ 75% để hoàn thành.</p></div></div>
    ${Object.keys(LEVELS).map((lv) => `
    <section class="section" style="margin-top:22px">
      <div class="section-title"><h2>${levelChip(lv)} ${LEVELS[lv].name}</h2><span class="muted small">${GRAMMAR.filter((g) => g.level === lv && P.grammar[g.id]).length}/${GRAMMAR.filter((g) => g.level === lv).length} hoàn thành</span></div>
      <div class="grid grid-3">
        ${GRAMMAR.filter((g) => g.level === lv).map((g, i) => `<a class="card hover topic-card" href="#/lesson/${g.id}" id="lesson-${g.id}">
          <div class="top"><div class="t-ico">${g.icon}</div><div><span class="muted small">Bài ${i + 1}</span><h3>${esc(g.title)}</h3></div></div>
          <span class="muted small">${esc(g.summary)}</span>
          <div class="foot"><span>${g.quiz.length} câu hỏi</span>${P.grammar[g.id] ? '<span class="done-mark">✓ Hoàn thành</span>' : '<span>Chưa học</span>'}</div>
        </a>`).join('')}
      </div>
    </section>`).join('')}`;

  VIEWS.lesson = (id) => {
    const g = GRAMMAR.find((x) => x.id === id);
    if (!g) return `<div class="empty"><div class="e-ico">🤔</div>Không tìm thấy bài học.</div>`;
    const i = GRAMMAR.indexOf(g), prev = GRAMMAR[i - 1], next = GRAMMAR[i + 1];
    return `<article class="lesson">
      <a class="muted small" href="#/grammar">← Ngữ pháp</a>
      <div class="page-head" style="margin-top:10px"><div><div class="row">${levelChip(g.level)}${P.grammar[g.id] ? '<span class="done-mark">✓ Đã hoàn thành</span>' : ''}</div><h1 style="margin-top:8px">${g.icon} ${esc(g.title)}</h1><p>${esc(g.summary)}</p></div></div>
      <div class="card lesson-body">${g.html}</div>
      <section class="section">
        <div class="section-title"><h2>✍️ Kiểm tra nhanh</h2><span class="muted small" id="quiz-score"></span></div>
        <div id="quiz">${g.quiz.map((q, qi) => `<div class="quiz-q" data-qi="${qi}">
          <h4>${qi + 1}. ${esc(q.q)}</h4>
          <div class="options">${q.options.map((o, oi) => `<button class="opt" data-oi="${oi}">${esc(o)}</button>`).join('')}</div>
          <div class="explain">💡 ${esc(q.explain)}</div></div>`).join('')}</div>
      </section>
      <div class="row section">
        ${prev ? `<a class="btn" href="#/lesson/${prev.id}">← ${esc(prev.title)}</a>` : ''}<span class="spacer"></span>
        ${next ? `<a class="btn" href="#/lesson/${next.id}">${esc(next.title)} →</a>` : ''}
      </div></article>`;
  };
  VIEWS.lesson.after = (id) => {
    const g = GRAMMAR.find((x) => x.id === id);
    if (!g) return;
    let answered = 0, correct = 0;
    $$('.quiz-q').forEach((box) => {
      const q = g.quiz[+box.dataset.qi];
      $$('.opt', box).forEach((b) => b.addEventListener('click', () => {
        if (box.classList.contains('done')) return;
        box.classList.add('done');
        const oi = +b.dataset.oi;
        $$('.opt', box).forEach((o) => { o.disabled = true; if (+o.dataset.oi === q.answer) o.classList.add('correct'); });
        if (oi === q.answer) { correct++; } else b.classList.add('wrong');
        answered++;
        if (answered === g.quiz.length) {
          const p = pct(correct, g.quiz.length);
          $('#quiz-score').innerHTML = `Kết quả: <b>${correct}/${g.quiz.length}</b> (${p}%)`;
          if (p >= 75) {
            const first = !P.grammar[g.id];
            P.grammar[g.id] = true;
            if (first) { P.xp += 30; xpPop(30, $('#quiz-score')); }
            save(); renderNav();
            toast(first ? '🎉 Hoàn thành bài học! +30 XP' : '👏 Làm tốt lắm!');
          } else {
            toast('💪 Chưa đạt 75%. Đọc lại bài và thử lần nữa nhé!');
            const btn = document.createElement('button');
            btn.className = 'btn btn-sm'; btn.textContent = '↻ Làm lại'; btn.style.marginLeft = '10px';
            btn.onclick = () => render();
            $('#quiz-score').appendChild(btn);
          }
        }
      }));
    });
  };

  /* ---------- Search ---------- */
  const fold = (s) => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/ß/g, 'ss');
  VIEWS.search = () => `
    <div class="page-head"><div><span class="eyebrow">Tra từ</span><h1>Từ điển mini</h1><p>Tìm theo tiếng Đức hoặc tiếng Việt (có thể gõ không dấu).</p></div></div>
    <div class="search-box"><input id="search-input" placeholder="Ví dụ: Zahn, bác sĩ, Montag…" autocomplete="off"></div>
    <div id="search-results"></div>`;
  VIEWS.search.after = () => {
    const inp = $('#search-input'), out = $('#search-results');
    const run = () => {
      const q = fold(inp.value.trim());
      if (!q) { out.innerHTML = `<div class="empty"><div class="e-ico">📖</div>Có ${WORDS.length} từ trong từ điển.</div>`; return; }
      const res = WORDS.filter((w) => fold(w.de).includes(q) || fold(w.vi).includes(q) || fold(w.extra).includes(q)).slice(0, 80);
      out.innerHTML = res.length ? `<table class="word-table"><tbody>${res.map((w) => `<tr class="word-row">
        <td><span class="st-dot ${status(w.id)}"></span><span class="word-de">${deHTML(w)}</span><div class="word-extra">${formatTableRowExtra(w.extra)}</div></td>
        <td>${esc(w.vi)}</td>
        <td class="hide-sm"><a class="chip" href="#/topic/${w.topic.id}">${w.topic.icon} ${esc(w.topic.title)}</a></td>
        <td>${sayBtns(w.de)}</td></tr>`).join('')}</tbody></table>` : `<div class="empty"><div class="e-ico">🔎</div>Không tìm thấy kết quả.</div>`;
    };
    inp.addEventListener('input', run); run(); inp.focus();
  };

  /* ---------- Settings ---------- */
  VIEWS.settings = () => `
    <div class="page-head"><div><span class="eyebrow">Cài đặt</span><h1>Cài đặt</h1></div></div>
    <div class="card">
      <div class="setting"><div><b>Nguồn phát âm</b><span class="muted small">Tự động: dùng giọng Đức trên máy, nếu không có thì dùng Google (cần mạng).</span></div>
        <select id="set-engine"><option value="auto">Tự động</option><option value="browser">Giọng trên máy</option><option value="google">Google TTS (online)</option></select></div>
      <div class="setting"><div><b>Giọng đọc tiếng Đức</b><span class="muted small">${voices.length ? `Tìm thấy ${voices.length} giọng trên máy.` : 'Không tìm thấy giọng Đức trên máy. (macOS: Cài đặt hệ thống → Trợ năng → Nội dung được đọc → Giọng hệ thống → thêm giọng Anna).'}</span></div>
        <select id="set-voice"><option value="">Mặc định</option>${voices.map((v) => `<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></div>
      <div class="setting"><div><b>Tốc độ đọc</b><span class="muted small" id="rate-label">${P.settings.rate.toFixed(2)}×</span></div>
        <div class="row"><input type="range" id="set-rate" min="0.5" max="1.3" step="0.05" value="${P.settings.rate}"><button class="icon-btn" data-say="Guten Tag! Wie geht es Ihnen?">🔊</button></div></div>
      <div class="setting"><div><b>Tự động phát âm</b><span class="muted small">Đọc từ khi hiện thẻ / sau khi trả lời.</span></div>
        <label class="switch"><input type="checkbox" id="set-autoplay" ${P.settings.autoplay ? 'checked' : ''}><span></span></label></div>
      <div class="setting"><div><b>Mục tiêu mỗi ngày</b><span class="muted small">Số thẻ cần luyện mỗi ngày.</span></div>
        <input type="number" id="set-goal" min="5" max="300" step="5" value="${P.goal}"></div>
    </div>
    <div class="card section">
      <div class="setting"><div><b>Sao lưu tiến độ</b><span class="muted small">Tải tệp JSON để chuyển sang máy khác.</span></div><button class="btn" id="btn-export">⬇ Xuất tiến độ</button></div>
      <div class="setting"><div><b>Khôi phục tiến độ</b><span class="muted small">Chọn tệp JSON đã xuất trước đó.</span></div><label class="btn" for="file-import">⬆ Nhập tiến độ</label><input type="file" id="file-import" accept=".json" hidden></div>
      <div class="setting"><div><b>Xóa toàn bộ tiến độ</b><span class="muted small">Không thể hoàn tác.</span></div><button class="btn" id="btn-reset" style="color:var(--ko)">🗑 Đặt lại</button></div>
    </div>`;
  VIEWS.settings.after = () => {
    $('#set-engine').value = P.settings.engine;
    $('#set-voice').value = P.settings.voice;
    $('#set-engine').onchange = (e) => { P.settings.engine = e.target.value; save(); };
    $('#set-voice').onchange = (e) => { P.settings.voice = e.target.value; save(); speak('Hallo, ich bin deine Stimme.'); };
    $('#set-rate').oninput = (e) => { P.settings.rate = +e.target.value; $('#rate-label').textContent = P.settings.rate.toFixed(2) + '×'; save(); };
    $('#set-autoplay').onchange = (e) => { P.settings.autoplay = e.target.checked; save(); };
    $('#set-goal').onchange = (e) => { P.goal = Math.max(5, Math.min(300, +e.target.value || 20)); save(); renderNav(); };
    $('#btn-export').onclick = () => {
      const blob = new Blob([JSON.stringify(P, null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tien-do-tieng-duc-${dayStr()}.json`; a.click();
    };
    $('#file-import').onchange = (e) => {
      const f = e.target.files[0]; if (!f) return;
      f.text().then((txt) => { const d = JSON.parse(txt); if (!d.cards) throw 0; localStorage.setItem(KEY, JSON.stringify(d)); P = load(); toast('✅ Đã khôi phục tiến độ'); render(); })
        .catch(() => toast('❌ Tệp không hợp lệ'));
    };
    $('#btn-reset').onclick = () => { if (confirm('Xóa toàn bộ tiến độ học?')) { P = defaults(); save(); toast('Đã đặt lại'); render(); } };
  };

  /* =========================================================
     PRACTICE ENGINE
     ========================================================= */
  let S = null;
  const scopeTitle = (scope) => {
    if (scope === 'due') return 'Từ đến hạn ôn';
    if (scope === 'weak') return 'Từ hay sai';
    if (scope === 'all') return 'Toàn bộ từ vựng';
    if (scope.startsWith('level-')) return 'Cấp độ ' + scope.slice(6);
    const t = TOPICS.find((x) => x.id === scope); return t ? `${t.icon} ${t.title}` : '';
  };
  function buildPool(scope) {
    if (scope === 'due') return dueWords();
    if (scope === 'weak') return weakWords();
    if (scope === 'all') return WORDS;
    if (scope.startsWith('level-')) return WORDS.filter((w) => w.level === scope.slice(6));
    const t = TOPICS.find((x) => x.id === scope); return t ? t.words : [];
  }
  function startSession(mode, scope, forced) {
    let pool = forced || buildPool(scope);
    if (mode === 'gender') pool = pool.filter((w) => w.gender);
    const isTopic = TOPICS.some((t) => t.id === scope);
    const n = forced ? forced.length : mode === 'flash' && isTopic ? 30 : isTopic ? 15 : 20;
    const rank = (w) => { const c = P.cards[w.id]; if (!c) return 1; if (c.due <= Date.now()) return 0; return c.box >= 4 ? 3 : 2; };
    const picked = shuffle(shuffle(pool).sort((a, b) => rank(a) - rank(b)).slice(0, n));
    const subModes = ['mc-de', 'mc-vi', 'listen', 'type'];
    S = {
      mode, scope, i: 0, ok: 0, ko: 0, xp: 0, wrong: [], answered: false,
      items: picked.map((w) => ({ w, mode: mode === 'mix' ? (w.gender && Math.random() < 0.25 ? 'gender' : subModes[Math.floor(Math.random() * subModes.length)]) : mode })),
    };
  }

  VIEWS.practice = (mode = 'mix', scope = 'all') => {
    if (!MODES[mode]) mode = 'mix';
    startSession(mode, scope);
    return `<div class="practice" id="practice"></div>`;
  };
  VIEWS.practice.after = () => drawQuestion();

  function backHref() {
    if (!S) return '#/home';
    if (TOPICS.some((t) => t.id === S.scope)) return `#/topic/${S.scope}`;
    return '#/review';
  }

  function headHTML() {
    return `<div class="p-head">
      <a class="icon-btn" href="${backHref()}" title="Thoát" id="btn-exit">✕</a>
      <div class="bar"><i class="fill" style="width:${pct(S.i, S.items.length)}%"></i></div>
      <span class="p-count">${Math.min(S.i + 1, S.items.length)}/${S.items.length}</span>
    </div>
    <div class="row muted small" style="justify-content:center;margin:-12px 0 18px">${MODES[S.mode].ico} ${MODES[S.mode].name} · ${esc(scopeTitle(S.scope))}</div>`;
  }

  function distractors(w, field, n = 3) {
    const val = (x) => (field === 'de' ? x.de : x.vi);
    const seen = new Set([fold(val(w))]);
    const out = [];
    const pools = [w.topic.words, WORDS.filter((x) => x.level === w.level), WORDS];
    for (const p of pools) {
      for (const x of shuffle(p)) {
        if (out.length >= n) break;
        const k = fold(val(x));
        if (seen.has(k)) continue;
        if (field === 'de' && w.gender && x.gender === undefined) continue;
        seen.add(k); out.push(x);
      }
      if (out.length >= n) break;
    }
    return out;
  }

  function drawQuestion() {
    const root = $('#practice');
    if (!root || !S) return;
    if (!S.items.length) {
      root.innerHTML = `${headHTML()}<div class="card empty"><div class="e-ico">🎈</div><h3>Không có từ nào để luyện</h3><p class="muted" style="margin:8px 0 18px">${S.scope === 'due' ? 'Chưa có từ nào đến hạn ôn.' : S.scope === 'weak' ? 'Bạn chưa có từ hay sai. Tuyệt vời!' : 'Phần này không có từ phù hợp với dạng bài.'}</p><a class="btn btn-primary" href="#/vocab">📚 Học chủ đề mới</a></div>`;
      return;
    }
    if (S.i >= S.items.length) return drawResult();
    S.answered = false;
    const it = S.items[S.i];
    const w = it.w;
    let body = '';
    keyHandler = null;

    if (it.mode === 'flash') {
      const deEsc = esc(w.de).replace(/'/g, "\\'");
      body = `<div class="flip" id="flip">
        <div class="flip-inner">
          <div class="flip-face"><div class="q-label">Tiếng Đức</div><div class="q-word">${deHTML(w)}</div><div class="q-sub">${esc(w.type)}</div>
            <div class="q-actions">${sayBtns(w.de)}</div><div class="flip-hint">Chạm hoặc nhấn Space để lật</div></div>
          <div class="flip-face flip-back"><div class="q-label">Nghĩa tiếng Việt</div><div class="q-word" style="font-size:clamp(1.6rem,5vw,2.4rem)">${esc(w.vi)}</div>
            <div class="q-sub"><b>${deHTML(w)}</b> <button type="button" class="icon-btn-sm" onclick="event.stopPropagation(); window.speak('${deEsc}', false, this);" title="Nghe từ">🔊</button></div>
            ${flashExtraHTML(w)}</div>
        </div></div>
        <div class="grade-btns" id="grade-btns" style="visibility:hidden">
          <button class="btn g-again" data-grade="again">😵 Chưa nhớ<small>phím 1</small></button>
          <button class="btn g-hard" data-grade="hard">🤔 Hơi khó<small>phím 2</small></button>
          <button class="btn g-good" data-grade="good">😎 Đã nhớ<small>phím 3</small></button>
        </div>`;
    } else if (it.mode === 'mc-de' || it.mode === 'mc-vi' || it.mode === 'listen') {
      const toDe = it.mode === 'mc-vi';
      const opts = shuffle([w, ...distractors(w, toDe ? 'de' : 'vi')]);
      it.opts = opts;
      const sWord = esc(w.de).replace(/'/g, "\\'");
      const prompt = it.mode === 'listen'
        ? `<div class="q-label">Nghe và chọn nghĩa đúng</div><div class="row" style="justify-content:center;gap:14px"><button type="button" class="btn btn-primary btn-lg" onclick="window.speak('${sWord}', false, this);" id="btn-listen">🔊 Nghe</button><button type="button" class="btn btn-lg" onclick="window.speak('${sWord}', true, this);">🐢 Chậm</button></div>`
        : toDe
          ? `<div class="q-label">Chọn từ tiếng Đức</div><div class="q-word" style="font-size:clamp(1.6rem,5vw,2.5rem)">${esc(w.vi)}</div><div class="q-sub">${esc(w.type)}</div>`
          : `<div class="q-label">Nghĩa tiếng Việt là gì?</div><div class="q-word">${deHTML(w)}</div><div class="q-actions">${sayBtns(w.de)}</div>`;

      body = `<div class="card q-card">${prompt}</div>
        <div class="options">${opts.map((o, i) => `<button class="opt" data-i="${i}"><kbd>${i + 1}</kbd><span>${toDe ? esc(o.de) : esc(o.vi)}</span></button>`).join('')}</div>
        <div id="fb"></div>`;
    } else if (it.mode === 'gender') {
      body = `<div class="card q-card"><div class="q-label">Chọn mạo từ đúng</div><div class="q-word">___ ${esc(nounBase(w))}</div><div class="q-sub">${esc(w.vi)}</div></div>
        <div class="gender-btns">${['der', 'die', 'das'].map((g, i) => `<button class="opt" data-g="${g}"><kbd>${i + 1}</kbd>${g}</button>`).join('')}</div>
        <div id="fb"></div>`;
    } else if (it.mode === 'type') {
      const hintType = w.gender ? 'Danh từ – viết kèm mạo từ (der/die/das)' : esc(w.type);
      body = `<div class="card q-card"><div class="q-label">Viết bằng tiếng Đức</div><div class="q-word" style="font-size:clamp(1.6rem,5vw,2.5rem)">${esc(w.vi)}</div><div class="q-sub">${hintType}</div>
        <div class="type-box"><input class="type-input" id="type-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nhập câu trả lời…"><button class="btn btn-primary" id="btn-check">Kiểm tra</button></div>
        <div class="umlauts">${['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü'].map((c) => `<button data-ch="${c}">${c}</button>`).join('')}<button id="btn-hint" title="Gợi ý" style="width:auto;padding:0 12px">💡 Gợi ý</button></div>
        <div class="q-sub small" id="hint-out"></div></div>
        <div id="fb"></div>`;
    }

    root.innerHTML = headHTML() + body + `<div class="kbd-hint">${it.mode === 'flash' ? 'Space: lật thẻ · 1/2/3: đánh giá' : it.mode === 'type' ? 'Enter: kiểm tra / tiếp tục' : 'Phím 1–4: chọn · Enter: tiếp tục'}</div>`;
    bindQuestion(it);
  }

  function bindQuestion(it) {
    const w = it.w;
    const auto = P.settings.autoplay;
    if (it.mode === 'flash') {
      const flip = $('#flip');
      const doFlip = () => { flip.classList.toggle('flipped'); $('#grade-btns').style.visibility = 'visible'; };
      flip.addEventListener('click', doFlip);
      $$('[data-grade]').forEach((b) => b.addEventListener('click', () => answerFlash(b.dataset.grade, b)));
      if (auto) setTimeout(() => speak(w.de), 250);
      keyHandler = (e) => {
        if (e.code === 'Space') { e.preventDefault(); doFlip(); }
        if (['1', '2', '3'].includes(e.key) && flip.classList.contains('flipped')) answerFlash(['again', 'hard', 'good'][+e.key - 1]);
      };
    } else if (it.mode === 'mc-de' || it.mode === 'mc-vi' || it.mode === 'listen') {
      $$('.opt').forEach((b) => b.addEventListener('click', () => answerChoice(+b.dataset.i)));
      if (it.mode === 'listen') setTimeout(() => speak(w.de), 300);
      else if (it.mode === 'mc-de' && auto) setTimeout(() => speak(w.de), 250);
      keyHandler = (e) => {
        if (!S.answered && /^[1-4]$/.test(e.key) && +e.key <= it.opts.length) answerChoice(+e.key - 1);
        else if (S.answered && e.key === 'Enter') next();
        else if (it.mode === 'listen' && e.key === ' ') { e.preventDefault(); speak(w.de); }
      };
    } else if (it.mode === 'gender') {
      $$('.opt[data-g]').forEach((b) => b.addEventListener('click', () => answerGender(b.dataset.g)));
      keyHandler = (e) => {
        if (!S.answered && /^[1-3]$/.test(e.key)) answerGender(['der', 'die', 'das'][+e.key - 1]);
        else if (S.answered && e.key === 'Enter') next();
      };
    } else if (it.mode === 'type') {
      const inp = $('#type-input');
      inp.focus();
      it.hint = 0;
      $$('.umlauts [data-ch]').forEach((b) => b.addEventListener('click', () => {
        const s = inp.selectionStart, e2 = inp.selectionEnd;
        inp.value = inp.value.slice(0, s) + b.dataset.ch + inp.value.slice(e2);
        inp.focus(); inp.setSelectionRange(s + 1, s + 1);
      }));
      $('#btn-hint').addEventListener('click', () => {
        it.hint = Math.min(it.hint + 1, Math.max(1, w.de.length - 1));
        const shown = w.de.slice(0, it.hint * 2);
        $('#hint-out').textContent = `Gợi ý: ${shown}${'_'.repeat(Math.max(0, w.de.length - shown.length))}`;
        inp.focus();
      });
      $('#btn-check').addEventListener('click', () => (S.answered ? next() : answerType()));
      keyHandler = (e) => { if (e.key === 'Enter') { e.preventDefault(); S.answered ? next() : answerType(); } };
    }
  }

  function wordInfo(w) {
    const info = parseExtra(w.extra);
    let extraHTML = '';
    if (info) {
      if (info.isPlural) {
        extraHTML = `<div class="muted small">Số nhiều: <b class="g-die">${esc(info.de)}</b> ${info.vi ? `(${esc(info.vi)})` : ''}</div>`;
      } else {
        extraHTML = `<div class="muted small">Ví dụ: <i>${esc(info.de)}</i> ${info.vi ? `↳ ${esc(info.vi)}` : ''}</div>`;
      }
    }
    return `<b>${deHTML(w)}</b> – ${esc(w.vi)}${extraHTML}`;
  }
  function showFeedback(ok, w, extraMsg = '') {
    $('#fb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'ko'}">
      <div class="f-ico">${ok ? '✅' : '❌'}</div>
      <div class="f-body"><div class="f-title">${ok ? ['Chính xác!', 'Sehr gut!', 'Toll!', 'Super!'][Math.floor(Math.random() * 4)] : 'Chưa đúng'} ${extraMsg}</div>${wordInfo(w)}</div>
      ${sayBtns(w.de)}</div>
      <div class="next-row"><button class="btn btn-primary" id="btn-next">Tiếp tục →</button></div>`;
    $('#btn-next').addEventListener('click', next);
    $('#btn-next').focus({ preventScroll: true });
    $('#fb').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function record(ok, w, gradeKey, el) {
    S.answered = true;
    const g = gradeKey || (ok ? 'good' : 'again');
    grade(w.id, g);
    const xp = g === 'again' ? 2 : g === 'hard' ? 5 : 10;
    S.xp += xp;
    if (ok) { S.ok++; xpPop(xp, el); } else { S.ko++; if (!S.wrong.includes(w)) S.wrong.push(w); }
  }

  function answerFlash(g, el) {
    if (S.answered) return;
    const w = S.items[S.i].w;
    record(g !== 'again', w, g, el);
    next();
  }
  function answerChoice(i) {
    if (S.answered) return;
    const it = S.items[S.i];
    const ok = it.opts[i] === it.w;
    $$('.opt').forEach((b, j) => { b.disabled = true; if (it.opts[j] === it.w) b.classList.add('correct'); else if (j === i) b.classList.add('wrong'); });
    record(ok, it.w, null, $$('.opt')[i]);
    if (P.settings.autoplay && it.mode !== 'mc-de') speak(it.w.de);
    showFeedback(ok, it.w);
  }
  function answerGender(g) {
    if (S.answered) return;
    const it = S.items[S.i];
    const ok = g === it.w.gender;
    $$('.opt[data-g]').forEach((b) => { b.disabled = true; if (b.dataset.g === it.w.gender) b.classList.add('correct'); else if (b.dataset.g === g) b.classList.add('wrong'); });
    record(ok, it.w, null, $(`.opt[data-g="${g}"]`));
    if (P.settings.autoplay) speak(it.w.de);
    showFeedback(ok, it.w);
  }
  const norm = (s) => String(s).toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/\(.*?\)/g, '').replace(/[^a-z0-9]/g, '');
  function answerType() {
    const it = S.items[S.i], w = it.w;
    const inp = $('#type-input');
    const val = inp.value.trim();
    if (!val) { inp.classList.remove('bad'); void inp.offsetWidth; inp.classList.add('bad'); return; }
    const ok = norm(val) === norm(w.de);
    let msg = '';
    if (!ok && w.gender) {
      const base = norm(nounBase(w));
      const v = norm(val);
      if (v === base) msg = '– thiếu mạo từ!';
      else if (v.endsWith(base) && /^(der|die|das)$/.test(v.slice(0, v.length - base.length))) msg = '– sai mạo từ!';
    }
    const exactUmlaut = ok && val.toLowerCase().replace(/\s+/g, ' ') !== w.de.toLowerCase();
    inp.classList.add(ok ? 'ok' : 'bad'); inp.disabled = true;
    $('#btn-check').textContent = 'Tiếp tục →';
    record(ok, w, ok && it.hint ? 'hard' : null, inp);
    if (P.settings.autoplay) speak(w.de);
    showFeedback(ok, w, ok && exactUmlaut ? `<span class="muted small">(viết chuẩn: ${esc(w.de)})</span>` : msg);
  }

  function next() {
    if (!S) return;
    S.i++;
    drawQuestion();
  }

  function drawResult() {
    const total = S.ok + S.ko;
    const p = pct(S.ok, total);
    const [ico, title] = p >= 90 ? ['🏆', 'Xuất sắc!'] : p >= 70 ? ['🎉', 'Làm tốt lắm!'] : p >= 50 ? ['💪', 'Cố lên nhé!'] : ['📚', 'Cần ôn thêm'];
    keyHandler = (e) => { if (e.key === 'Enter') location.hash = backHref(); };
    $('#practice').innerHTML = `<div class="card result">
      <div class="big">${ico}</div><h2>${title}</h2>
      <p class="muted">${MODES[S.mode].name} · ${esc(scopeTitle(S.scope))}</p>
      <div style="display:flex;justify-content:center;margin-top:20px">${ring(S.ok, total || 1, 140, p + '%', 'chính xác')}</div>
      <div class="result-stats"><div><b style="color:var(--ok)">${S.ok}</b><span>Đúng / nhớ</span></div><div><b style="color:var(--ko)">${S.ko}</b><span>Sai / quên</span></div><div><b class="grad-text">+${S.xp}</b><span>XP</span></div></div>
      <div class="row" style="justify-content:center">
        ${S.wrong.length ? `<button class="btn btn-primary" id="btn-retry-wrong">🩹 Ôn lại ${S.wrong.length} từ sai</button>` : ''}
        <button class="btn" id="btn-again">↻ Luyện lượt mới</button>
        <a class="btn" href="${backHref()}">← Quay lại</a>
      </div>
      ${S.wrong.length ? `<div class="wrong-list"><h3 style="margin:14px 0 4px">Từ cần ôn lại</h3>${S.wrong.map((w) => `<div class="wrong-item"><div class="spacer"><b>${deHTML(w)}</b> – ${esc(w.vi)}</div>${sayBtns(w.de)}</div>`).join('')}</div>` : ''}
    </div>`;
    animateRings();
    const { mode, scope, wrong } = S;
    $('#btn-again').onclick = () => { startSession(mode, scope); drawQuestion(); };
    const rw = $('#btn-retry-wrong');
    if (rw) rw.onclick = () => { startSession(mode, scope, wrong); drawQuestion(); };
  }

  /* ---------------- Global events ---------------- */
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-say]');
    if (b) { e.preventDefault(); e.stopPropagation(); speak(b.dataset.say, b.dataset.slow === '1'); return; }
    const s = e.target.closest('.say');
    if (s) speak(s.textContent);
  });
  document.addEventListener('keydown', (e) => {
    if (!keyHandler) return;
    const tag = document.activeElement?.tagName;
    if ((tag === 'INPUT' || tag === 'SELECT') && e.key !== 'Enter') return;
    if (tag === 'BUTTON' && e.key === 'Enter' && document.activeElement.id !== 'btn-next' && document.activeElement.id !== 'btn-check') return;
    if (document.activeElement?.id === 'btn-next' && e.key === 'Enter') { e.preventDefault(); next(); return; }
    keyHandler(e);
  });
  window.addEventListener('hashchange', render);
  render();
})();

</script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
